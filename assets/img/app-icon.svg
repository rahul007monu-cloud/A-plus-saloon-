<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="A Plus Salon app icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a2440"/>
      <stop offset="1" stop-color="#2a1a2e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6b422"/>
      <stop offset="1" stop-color="#b8860b"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed background so it works as a maskable icon (safe zone respected) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#gold)" stroke-width="8" opacity="0.35"/>
  <text x="256" y="300" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="200" font-weight="700" fill="url(#gold)">A+</text>
</svg>
